[package]
name = "fruit"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Fruit — local-first planner, tracker and reconciler"
license = "MIT"
default-run = "fruit"

# Deliberately its own workspace: linking this crate needs a system webview
# (webkit2gtk on Linux, WebView2 on Windows, WKWebView on macOS), and
# `fruit-core` has to stay testable on a machine that has none.
[workspace]

[lib]
name = "fruit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fruit-core = { path = "../crates/fruit-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
log = "0.4"

[profile.release]
opt-level = "s"   # installer budget is < 15MB per platform (§7.1)
lto = true
codegen-units = 1
panic = "abort"
strip = true
