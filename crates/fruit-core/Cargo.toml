[package]
name = "fruit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Domain, storage and command layer for Fruit. Contains no UI and no Tauri dependency."

[dependencies]
calamine = { version = "0.30.1", default-features = false }
chrono.workspace = true
chrono-tz.workspace = true
rusqlite.workspace = true
rust_xlsxwriter = { version = "0.92.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dump-fixtures"
path = "src/bin/dump_fixtures.rs"
