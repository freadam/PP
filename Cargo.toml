[workspace]
# `src-tauri` is deliberately its own workspace: linking it needs a system
# webview (webkit2gtk on Linux), and `fruit-core` must stay testable on a
# machine that has none. See docs/ARCHITECTURE.md.
members = ["crates/fruit-core"]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[workspace.dependencies]
fruit-core = { path = "crates/fruit-core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v7"] }
